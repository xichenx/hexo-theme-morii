name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/release.cjs check "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - name: Package theme
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run package:theme -- "$RELEASE_TAG"
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--draft --verify-tag --title "Morii $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md)
          if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/morii-release-state" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/morii-release-state")" != 'true' ]]; then
              echo 'The release is already published; refusing to replace its assets.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "Morii $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md --prerelease="$PRERELEASE"
            gh release upload "$RELEASE_TAG" "dist/$ARCHIVE" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$ARCHIVE" dist/SHA256SUMS.txt "${args[@]}"
          fi
