# 保存位置：博客根目录 _config.morii.yml
# 这是入门第 2 步使用的完整文件。已有个人配置时请先备份。
brand: 小林的笔记
tagline: 记录学习与生活
intro: 你好，我是小林。这里记录我的学习笔记和日常。
avatar: /icons/brand/morii-icon.png

hero:
  title:
    0: 你好，我是小林。
    1: 欢迎来到我的笔记本。
  note: 从第一篇文章开始，慢慢把这里填满。

# 页面建好后，第 4 步会把 menu 替换为完整菜单。
