# 页面布局。也可写入博客根目录的 _config.morii.yml，升级主题时无需修改主题文件。
appearance:
  effects:
    enable: true        # 视觉特效总开关；独立于页面布局
    aurora: true        # 渐变极光背景
    particles: true     # 原生 Canvas 星尘与近邻连线
    density: 48         # 桌面粒子数量（12–80），手机最多 18 个
    glass: true         # 导航和展示卡片的毛玻璃
    spotlight: true     # 鼠标跟随卡片光晕（精细指针设备）
    tilt: true          # 卡片轻量立体倾斜（精细指针设备）
    ripple: true        # 按钮点击波纹
    theme_transition: true  # 深浅色切换圆形扩散，不支持时直接切换
  layouts:
    home: featured       # featured：首篇横向突出（奇数篇时）；grid：普通双列
    categories: atlas    # atlas：双列主题导航；directory：分类目录；cards：独立卡片
    category: list       # list：文章行列表；cards：文章卡片与侧栏
    archives: timeline   # timeline：时间树；grouped：按年份分组的列表卡片
motion:
  # 卡片滚动入场、首页氛围和交互动效；遵循系统减少动态效果设置。
  enable: true
# 留空继承博客 _config.yml；原有显式设置继续优先。
brand: ''
github_calendar:
  enable: null # 未配置时关闭，兼容旧站点 githubcalendar.enable
  user: ''
  # 支持兼容 GitHub Contributions API v4 的自建服务，{user} 会替换为账号。
  api: 'https://github-contributions-api.jogruber.de/v4/{user}?y=last'
favicon: /icons/brand/morii-logo-v2.png
logo: /icons/brand/morii-logo-v2.png
footer:
  runtime:
    enable: false
    # 启用后填写自己的上线时间和时区。
    start: ''
    label: ''
  filing:
    enable: false
    icp:
      # 填写自己的备案号；留空不显示。
      number: ''
      url: https://beian.miit.gov.cn/
    police:
      number: ''
      # 填写公安备案查询页面的完整链接。
      url: ''
tagline: '' # 继承博客 subtitle；false 可隐藏
intro: ''   # 继承博客 description；false 可隐藏
avatar: ''  # 继承博客 avatar，否则使用内置 Morii 图标
social: []
accent: '#5568f6'
accent_dark: '#8c9aff'
hero:
  title: [] # 未配置时使用博客 title / subtitle
  note: ''
home:
  moments:
    enable: true
    limit: 5
  random:
    enable: true
  selected_limit: 3
  # 可填写文章标题或文章路径，顺序即展示顺序。
  selected_posts: []
about:
  show_interests: true
search:
  inverted: true  # 大站点使用倒排索引，仅下载命中文章所在正文分片
  worker: true    # 浏览器允许时将筛选计算放入 Web Worker
  shard_size: 100 # 超过此篇数使用分片；标题/分类搜索无需下载全文分片
  content: true
  page_size: 10
reading_list:
  enable: true
quick_navigation:
  enable: true
clock:
  enable: false
  city: ''
  latitude: null
  longitude: null
  timezone: '' # 继承博客 timezone；只开时钟无需填写坐标
article:
  enhancements:
    # 默认不下载渲染库；单篇文章也可用 mermaid: true / math: true 开启。
    mermaid: false
    math: false
    mermaid_url: ''
    math_url: ''
    math_css: ''
  resume:
    enable: true
  share:
    enable: true
  print:
    enable: true
  reading_settings: true
  navigation: true
  outdated:
    enable: true
    days: 365
  related:
    enable: true
    limit: 3
  code:
    collapse: true
    # 超过此行数的代码默认收起；复制始终包含完整代码。
    lines: 18
sidebar:
  announcement:
    enable: false
    title: ''
    content: ''
  tags:
    enable: true
    limit: 12
  stats:
    enable: true
explore: []
friends_feed:
  endpoint: ''
  page_size: 12
music:
  title: 我的音乐收藏
  description: 给日常留一点旋律，边听边逛。
  playlist_url: ''
  playlist_label: ''
  volume: 0.7
  # 与 AnZhiYu 相同的 Meting 歌单配置，访问音乐馆时获取歌曲。
  meting:
    enable: false
    server: tencent
    type: playlist
    id: ''
    api: 'https://api.injahow.cn/meting/?server=:server&type=:type&id=:id&r=:r'
  # 可选：官方提供的 HTTPS 嵌入播放器。
  embed_url: ''
  # 可选：自有音频资源，格式为 title / artist / url / cover。
  tracks: []
cinema:
  enable: false
  title: 电影院
  description: 挑一部喜欢的作品，慢慢看。
  # 片单优先从博客根目录 source/_data/cinema.yml 读取；也可在此填写 items。
  items: []
menu:
  - name: 首页
    path: /
  - name: 文章
    path: /archives/
featured: []
comments:
  enable: false
  provider: twikoo # twikoo / waline
  server_url: ''  # 使用 Waline 时填写服务端地址
  style_url: ''   # Waline 样式地址，可自托管
  recent:
    enable: false # 可选的 Twikoo 最新评论侧栏
    limit: 5
  # 可指定同域脚本或 CDN；前端版本应与后端一致。留空沿用默认脚本。
  script_url: ''
  env_id: ''

# 默认关闭；也可在单次访问链接添加 ?morii-debug=1 开启本地加载诊断。
performance:
  diagnostics: false

seo:
  structured_data: true
  # 全站分享图；单篇文章 share_image 优先于 cover，建议填写站内路径或 HTTPS 地址。
  default_image: ''

series:
  enable: true # 根据文章 series / series_order 自动生成 /series/ 专题页

images:
  responsive: true  # 使用可选 sharp 为本地封面生成 WebP 候选
  widths: [480, 800, 1200]
  quality: 78
  cover_tone: true  # 封面取色只用于文章头部，保持正文主题色
